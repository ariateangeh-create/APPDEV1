<!DOCTYPE html>
<html>
<head>
  <title>DOM Practice</title>
</head>
<body>
  <h1>My JavaScript DOM Practice</h1>

  <button id="changeColorBtn">Change Background</button>
  <p id="message">This paragraph will update in 2 seconds.</p>

  <script>
    const button = document.getElementById("changeColorBtn");

    button.addEventListener("click", () => {
      const color = prompt("What color should the background be?");
      if (color) {
        document.body.style.backgroundColor = color;
      }
    });

    const message = document.getElementById("message");

    setTimeout(() => {
      message.textContent = "I changed this paragraph using setTimeout()!";
    }, 2000);
  </script>
</body>
</html>
